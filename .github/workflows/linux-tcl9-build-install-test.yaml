# This is a basic workflow to help you get started with Actions

name: Linux tcl9 build-install-test

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        set -x
        ## Skip this, it seems to be bitrotted, do we need it?
        #sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update -qq
        sudo apt-get install -y gcc-11 g++-11
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 110 --slave /usr/bin/g++ g++ /usr/bin/g++-11
        sudo apt-get install -y tcl9.0-dev tcllib libboost-all-dev
        git clone -b v9.0.0 https://github.com/flightaware/tclx.git
        cd tclx
        autoreconf -vi
        ./configure --with-tcl=/usr/lib/tcl9.0
        make
        sudo make install
    - name: configure
      run: |       
        autoreconf -vi
        ./configure --with-tcl=/usr/lib/tcl9.0
    - name: make
      run: make
    - name: install
      run: sudo make install
    - name: test
      run: make -C ctables test
